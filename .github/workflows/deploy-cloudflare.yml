# Despliegue automático: solo configurá los GitHub Secrets (ver docs/github-actions-deploy.md).
name: Deploy Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate PWA icons and OG image
        run: npm run icons:pwa

      - name: Production build
        env:
          VITE_WHATSAPP_APEX: ${{ secrets.VITE_WHATSAPP_APEX }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
          VITE_APEX_OPERACION_VIVO: "true"
        run: npm run build

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config dist/server/wrangler.json

      - name: Sync runtime secrets to Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ADMIN_PIN: ${{ secrets.ADMIN_PIN }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
          VITE_WHATSAPP_APEX: ${{ secrets.VITE_WHATSAPP_APEX }}
          APEX_ADMIN_WHATSAPP: ${{ secrets.APEX_ADMIN_WHATSAPP }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          put_secret() { local name="$1" val="$2"; [ -n "$val" ] || return 0; printf '%s' "$val" | npx wrangler secret put "$name" --config dist/server/wrangler.json; }
          put_secret VITE_SITE_URL "$VITE_SITE_URL"
          put_secret SUPABASE_URL "$SUPABASE_URL"
          put_secret SUPABASE_SERVICE_ROLE_KEY "$SUPABASE_SERVICE_ROLE_KEY"
          put_secret ADMIN_PIN "$ADMIN_PIN"
          put_secret VAPID_PUBLIC_KEY "$VAPID_PUBLIC_KEY"
          put_secret VAPID_PRIVATE_KEY "$VAPID_PRIVATE_KEY"
          put_secret VAPID_SUBJECT "$VAPID_SUBJECT"
          put_secret WHATSAPP_APEX "$VITE_WHATSAPP_APEX"
          put_secret VITE_WHATSAPP_APEX "$VITE_WHATSAPP_APEX"
          ADMIN_WA="${APEX_ADMIN_WHATSAPP:-$VITE_WHATSAPP_APEX}"
          put_secret APEX_ADMIN_WHATSAPP "$ADMIN_WA"
          put_secret WHATSAPP_ACCESS_TOKEN "$WHATSAPP_ACCESS_TOKEN"
          put_secret WHATSAPP_PHONE_NUMBER_ID "$WHATSAPP_PHONE_NUMBER_ID"
          put_secret WHATSAPP_VERIFY_TOKEN "$WHATSAPP_VERIFY_TOKEN"
          put_secret GROQ_API_KEY "$GROQ_API_KEY"

      - name: Smoke post-deploy
        env:
          SITE_URL: ${{ secrets.VITE_SITE_URL || 'https://apex-suspension.com.co' }}
        run: node scripts/qa-produccion-smoke.mjs

      - name: Alertar si smoke falla (ntfy)
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -n "$NTFY_TOPIC" ]; then
            curl -fsS \
              -H "Title: Apex deploy con fallo" \
              -H "Priority: high" \
              -d "Smoke post-deploy falló tras publicar en Cloudflare." \
              "https://ntfy.sh/$NTFY_TOPIC"
          fi
