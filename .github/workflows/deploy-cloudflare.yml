# Despliegue automático: solo configurá los GitHub Secrets (ver docs/github-actions-deploy.md).
name: Deploy Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate PWA icons and OG image
        run: npm run icons:pwa

      - name: Production build
        env:
          VITE_WHATSAPP_APEX: ${{ secrets.VITE_WHATSAPP_APEX }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
          VITE_APEX_OPERACION_VIVO: "true"
        run: npm run build

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config dist/server/wrangler.json

      - name: Sync runtime secrets to Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ADMIN_PIN: ${{ secrets.ADMIN_PIN }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
          VITE_WHATSAPP_APEX: ${{ secrets.VITE_WHATSAPP_APEX }}
          APEX_ADMIN_WHATSAPP: ${{ secrets.APEX_ADMIN_WHATSAPP }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          printf '%s' "$VITE_SITE_URL" | npx wrangler secret put VITE_SITE_URL --config dist/server/wrangler.json
          printf '%s' "$SUPABASE_URL" | npx wrangler secret put SUPABASE_URL --config dist/server/wrangler.json
          printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY --config dist/server/wrangler.json
          printf '%s' "$ADMIN_PIN" | npx wrangler secret put ADMIN_PIN --config dist/server/wrangler.json
          printf '%s' "$VAPID_PUBLIC_KEY" | npx wrangler secret put VAPID_PUBLIC_KEY --config dist/server/wrangler.json
          printf '%s' "$VAPID_PRIVATE_KEY" | npx wrangler secret put VAPID_PRIVATE_KEY --config dist/server/wrangler.json
          printf '%s' "$VAPID_SUBJECT" | npx wrangler secret put VAPID_SUBJECT --config dist/server/wrangler.json
          printf '%s' "$VITE_WHATSAPP_APEX" | npx wrangler secret put WHATSAPP_APEX --config dist/server/wrangler.json
          printf '%s' "$VITE_WHATSAPP_APEX" | npx wrangler secret put VITE_WHATSAPP_APEX --config dist/server/wrangler.json
          ADMIN_WA="${APEX_ADMIN_WHATSAPP:-$VITE_WHATSAPP_APEX}"
          printf '%s' "$ADMIN_WA" | npx wrangler secret put APEX_ADMIN_WHATSAPP --config dist/server/wrangler.json
          if [ -n "$WHATSAPP_ACCESS_TOKEN" ]; then
            printf '%s' "$WHATSAPP_ACCESS_TOKEN" | npx wrangler secret put WHATSAPP_ACCESS_TOKEN --config dist/server/wrangler.json
          fi
          if [ -n "$WHATSAPP_PHONE_NUMBER_ID" ]; then
            printf '%s' "$WHATSAPP_PHONE_NUMBER_ID" | npx wrangler secret put WHATSAPP_PHONE_NUMBER_ID --config dist/server/wrangler.json
          fi
          if [ -n "$WHATSAPP_VERIFY_TOKEN" ]; then
            printf '%s' "$WHATSAPP_VERIFY_TOKEN" | npx wrangler secret put WHATSAPP_VERIFY_TOKEN --config dist/server/wrangler.json
          fi
          if [ -n "$GROQ_API_KEY" ]; then
            printf '%s' "$GROQ_API_KEY" | npx wrangler secret put GROQ_API_KEY --config dist/server/wrangler.json
          fi
